# A minimal frontend schema using the pinned upstream pinyin_simp dictionary.
schema:
  schema_id: dual_line
  name: 双行译全拼
  version: '0.3'
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
  algebra:
    - abbrev/^([a-z]).+$/$1/
translator:
  dictionary: pinyin_simp
  enable_user_dict: true
menu:
  page_size: 15
