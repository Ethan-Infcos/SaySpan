schema:
  schema_id: sayspan
  name: SaySpan Pinyin
  version: '0.1'
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
  algebra:
    - abbrev/^([a-z]).+$/$1/
translator:
  dictionary: pinyin_simp
  enable_user_dict: false
menu:
  page_size: 5
